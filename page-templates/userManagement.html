<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com" defer></script>
</head>

<body class="bg-gray-100 text-gray-800">
    <!-- Main Container -->
        <!-- Header -->
        

        <!-- Search and Filter -->
        <section class="px-4 py-4 max-w-7xl mx-auto md:flex md:gap-2">
                <input type="text" placeholder="Search by name or email" class="input input-bordered w-full md:w-1/4" />
                <select class="select select-bordered mt-3 w-full md:mt-0 md:w-1/4 ">
                    <option disabled selected>Filter by Permission</option>
                    <option>User</option>
                    <option>Admin</option>
                </select>
                <div class="flex items-center justify-between mt-3 px-2 md:mt-0 md:grow">
                    <button class="btn btn-primary btn-sm md:btn-md">Search</button>
                    <button class="btn btn-sm btn-primary md:btn-md" id="add-user-btn">+ Add New User</button>
                </div>
        </section>

        <!-- User Table -->
        <main class="flex-grow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="bg-white shadow overflow-x-scroll sm:rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">University</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Role</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <!-- Example Row -->
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">john.doe@example.com</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Example University</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Admin</td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <button class="btn btn-sm btn-outline btn-primary">Edit</button>
                                </td>
                            </tr>
                            <!-- Add more rows as needed -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="join mt-4">
                    <input
                      class="join-item btn btn-square"
                      type="radio"
                      name="options"
                      aria-label="1"
                      checked="checked" />
                    <input class="join-item btn btn-square" type="radio" name="options" aria-label="2" />
                    <input class="join-item btn btn-square" type="radio" name="options" aria-label="3" />
                    <input class="join-item btn btn-square" type="radio" name="options" aria-label="4" />
                </div>
            </div>
        </main>
    </div>

    <!-- Add User Modal -->
    <dialog id="add-user-modal" class="modal">
        <form method="dialog" class="modal-box">
            <h3 class="font-bold text-lg">Add New User</h3>
            <div class="py-4">
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" placeholder="Email" class="input input-bordered w-full" required />
            </div>
            <div class="py-4">
                <label class="block text-sm font-medium text-gray-700">University</label>
                <input type="text" placeholder="University" class="input input-bordered w-full" required />
            </div>
            <div class="py-4">
                <label class="block text-sm font-medium text-gray-700">Role</label>
                <select class="select select-bordered w-full" required>
                    <option disabled selected>Select Role</option>
                    <option>User</option>
                    <option>Admin</option>
                </select>
            </div>
            <div class="py-4">
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" placeholder="Password" class="input input-bordered w-full" required />
            </div>
            <div class="modal-action">
                <button class="btn btn-primary">Save</button>
                <button class="btn" formmethod="dialog">Cancel</button>
            </div>
        </form>
    </dialog>

    <script>
        // Modal handling
        const modal = document.getElementById("add-user-modal");
        const openBtn = document.getElementById("add-user-btn");

        openBtn.addEventListener("click", () => modal.showModal());
    </script>
</body>

</html>
