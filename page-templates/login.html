<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - SPKP</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com" defer></script>
    </head>

    <body class="bg-gray-100 text-gray-800">

        <nav class="bg-base-100">
            <div class="navbar max-w-7xl mx-auto">
                <ul class="navbar-start">
                    <div class="dropdown">
                        <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h8m-8 6h16" />
                            </svg>
                        </div>
                        <ul tabindex="0"
                            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-72 p-2 shadow">
                            <li><a>Home</a></li>
                            <li>
                                <a>Gallery</a>
                            </li>
                            <li><a>About</a></li>
                            <!-- <li><a>Login</a></li> -->
                            <li>
                                <details>
                                    <summary>Dashboard</summary>
                                    <ul class="p-2">
                                        <li><a>Projects</a></li>
                                        <li><a>Users</a></li>
                                        <li><a>Profile</a></li>
                                    </ul>
                                </details>
                            </li>

                            <li><a>Logout</a></li>
                        </ul>
                    </div>
                    <a class="btn btn-ghost text-xl">ProjectDB</a>
                </ul>
                <ul class="navbar-end hidden lg:flex">
                    <ul class="menu menu-horizontal px-1">
                        <li><a>Home</a></li>
                        <li>
                            <a>Gallery</a>
                        </li>
                        <li><a>About</a></li>
                        <!-- <li><a>Login</a></li> -->
                        <li>
                            <details>
                                <summary>Dashboard</summary>
                                <ul class="p-2">
                                    <li><a>Projects</a></li>
                                    <li><a>Users</a></li>
                                    <li><a>Profile</a></li>
                                </ul>
                            </details>
                        </li>

                        <li><a>Logout</a></li>
                    </ul>
                </ul>
            </div>
        </nav>
        <!-- Login Page -->
        <main class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
            <!-- Heading -->
            <section class="sm:mx-auto sm:w-full sm:max-w-md text-center">
                <h1 class="text-3xl font-bold text-gray-900">Admin Login</h1>
            </section>

            <!-- Login Form -->
            <section class="mt-8 mx-auto w-4/5 max-w-md">
                <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
                    <form class="form-control space-y-6" method="POST">
                        <!-- Email Field -->
                        <label class="w-full max-w-xs">
                            <div class="label">
                                <span class="label-text">What is your name?</span>
                            </div>
                            <input type="text" placeholder="Type here" class="input input-bordered w-full max-w-xs" />

                        </label>

                        <!-- Password Field -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                required
                                class="mt-1 input input-bordered w-full focus:outline-none focus:ring focus:ring-blue-500" />
                        </div>

                        <!-- Submit Button -->
                        <div>
                            <button type="submit" class="btn btn-primary w-full">
                                Sign In
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

    </body>

</html>
